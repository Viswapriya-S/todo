<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Project - To-Do List</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            overflow: hidden;
            color: white;

            /* Space background */
            background:
                radial-gradient(circle at 50% 45%, rgba(255, 50, 130, 0.45), transparent 20%),
                radial-gradient(circle at 50% 30%, rgba(100, 40, 100, 0.35), transparent 30%),
                linear-gradient(
                    to bottom,
                    #120c1d 0%,
                    #211127 35%,
                    #68204f 70%,
                    #182238 100%
                );
        }

        /* Stars */
        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background-image:
                radial-gradient(circle, white 1px, transparent 1.5px),
                radial-gradient(circle, white 1px, transparent 1.5px),
                radial-gradient(circle, white 1.5px, transparent 2px);

            background-size:
                170px 130px,
                250px 190px,
                320px 240px;

            background-position:
                20px 30px,
                80px 100px,
                150px 40px;

            opacity: 0.7;
            pointer-events: none;
        }

        /* Large moon/planet */
        .planet {
            position: fixed;
            width: 650px;
            height: 650px;

            border-radius: 50%;

            background: rgba(20, 5, 30, 0.25);

            top: 25%;
            left: 50%;

            transform: translate(-50%, -50%);

            box-shadow:
                0 0 80px rgba(255, 30, 120, 0.25);

            z-index: 0;
        }

        /* Pink glow */
        .glow {
            position: fixed;

            width: 500px;
            height: 250px;

            left: 50%;
            top: 52%;

            transform: translate(-50%, -50%);

            background: rgba(255, 30, 120, 0.45);

            filter: blur(70px);

            border-radius: 50%;

            z-index: 0;
        }

        /* Main page */
        .main {
            position: relative;
            z-index: 5;

            width: 100%;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 100px;

            padding-bottom: 30px;
        }

        /* ---------------- APP CARD ---------------- */

        .todo-card {
            width: 285px;
            min-height: 400px;

            padding: 20px;

            border: 1px solid rgba(255, 255, 255, 0.25);

            border-radius: 12px;

            background: rgba(25, 12, 30, 0.45);

            backdrop-filter: blur(8px);

            box-shadow:
                0 0 30px rgba(0, 0, 0, 0.2);
        }

        .todo-card h2 {
            text-align: center;

            font-size: 21px;

            margin-bottom: 25px;
        }

        /* Progress box */
        .progress-box {
            border: 1px solid rgba(255, 255, 255, 0.2);

            border-radius: 8px;

            padding: 14px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 15px;
        }

        .progress-info {
            width: 150px;
        }

        .progress-info p {
            font-size: 12px;
            font-weight: bold;

            margin-bottom: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;

            background: #625568;

            border-radius: 10px;

            overflow: hidden;
        }

        .progress-fill {
            width: 0%;

            height: 100%;

            background: #ff5c91;

            border-radius: 10px;

            transition: 0.3s;
        }

        .counter {
            width: 52px;
            height: 52px;

            border-radius: 50%;

            background: #ff5c91;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 14px;
            font-weight: bold;
        }

        /* Input */
        .input-area {
            display: flex;

            gap: 8px;

            margin-bottom: 15px;
        }

        .input-area input {
            width: 100%;

            height: 30px;

            border: none;
            outline: none;

            border-radius: 20px;

            padding: 0 12px;

            background: #765c72;

            color: white;

            font-size: 11px;
        }

        .input-area input::placeholder {
            color: #ddd;
        }

        .add-btn {
            width: 30px;
            height: 30px;

            border: none;

            border-radius: 50%;

            background: #dca3d0;

            color: white;

            font-size: 20px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .add-btn:hover {
            background: #ff5c91;
        }

        /* Task list */
        #taskList {
            list-style: none;

            max-height: 250px;

            overflow-y: auto;
        }

        #taskList::-webkit-scrollbar {
            width: 4px;
        }

        #taskList::-webkit-scrollbar-thumb {
            background: #ff5c91;
            border-radius: 10px;
        }

        .task {
            height: 36px;

            background: rgba(140, 103, 130, 0.75);

            border-radius: 20px;

            margin-bottom: 8px;

            padding: 0 8px;

            display: flex;

            align-items: center;

            gap: 7px;

            font-size: 11px;
        }

        /* Check circle */
        .check {
            width: 18px;
            height: 18px;

            min-width: 18px;

            border-radius: 50%;

            border: 1px solid white;

            background: transparent;

            cursor: pointer;

            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 11px;
        }

        .task.completed .check {
            background: #ff5c91;

            border-color: #ff5c91;
        }

        .task.completed .task-name {
            text-decoration: line-through;

            opacity: 0.6;
        }

        .task-name {
            flex: 1;

            overflow: hidden;

            white-space: nowrap;

            text-overflow: ellipsis;
        }

        /* Edit/Delete buttons */
        .task-btn {
            width: 20px;
            height: 20px;

            border: none;

            border-radius: 50%;

            cursor: pointer;

            color: white;

            font-size: 10px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .edit {
            background: #ffca3a;
        }

        .delete {
            background: #ff5c91;
        }

        .task-btn:hover {
            transform: scale(1.1);
        }

        /* ---------------- RIGHT CONTENT ---------------- */

        .hero {
            text-align: center;

            width: 550px;
        }

        .subtitle {
            color: #ff648f;

            font-family: Georgia, serif;

            font-size: 34px;

            font-weight: bold;

            margin-bottom: 0;
        }

        .hero h1 {
            font-family: Georgia, serif;

            font-size: 68px;

            line-height: 0.95;

            color: white;

            text-shadow:
                3px 3px 0 #ccc,
                0 0 15px rgba(255, 255, 255, 0.15);

            margin-bottom: 50px;
        }

        /* Technology labels */
        .technologies {
            display: flex;

            justify-content: center;

            gap: 50px;
        }

        .tech {
            text-align: center;
        }

        .tech h3 {
            font-size: 24px;

            margin-bottom: 8px;
        }

        /* Shield shapes */
        .badge {
            width: 65px;
            height: 78px;

            display: flex;

            justify-content: center;
            align-items: center;

            font-weight: bold;

            font-size: 28px;

            color: white;

            clip-path: polygon(
                10% 0,
                90% 0,
                100% 75%,
                50% 100%,
                0 75%
            );
        }

        .html-badge {
            background: #f47732;
        }

        .css-badge {
            background: #229fd0;
        }

        .js-badge {
            background: #f1c832;

            color: #222;
        }

        /* ---------------- MOUNTAINS ---------------- */

        .mountains {
            position: fixed;

            bottom: 0;
            left: 0;

            width: 100%;

            height: 90px;

            z-index: 2;

            background: #0c1b31;

            clip-path: polygon(
                0 55%,
                10% 40%,
                18% 60%,
                27% 25%,
                35% 55%,
                44% 20%,
                52% 55%,
                63% 30%,
                72% 58%,
                84% 25%,
                92% 55%,
                100% 35%,
                100% 100%,
                0 100%
            );
        }

        .mountains::after {
            content: "";

            position: absolute;

            width: 100%;
            height: 100%;

            background: #12243c;

            left: -30px;
            top: 15px;

            clip-path: polygon(
                0 65%,
                12% 45%,
                22% 70%,
                32% 30%,
                42% 65%,
                55% 35%,
                65% 70%,
                78% 40%,
                88% 68%,
                100% 45%,
                100% 100%,
                0 100%
            );
        }

        /* Responsive */
        @media (max-width: 1000px) {

            body {
                overflow: auto;
            }

            .main {
                height: auto;
                min-height: 100vh;

                flex-direction: column;

                gap: 40px;

                padding: 50px 20px;
            }

            .hero {
                order: -1;

                width: 100%;
            }

            .hero h1 {
                font-size: 50px;
            }

            .subtitle {
                font-size: 25px;
            }

            .todo-card {
                width: 300px;
            }
        }

        @media (max-width: 500px) {

            .hero h1 {
                font-size: 40px;
            }

            .technologies {
                gap: 25px;
            }

            .main {
                padding-bottom: 100px;
            }
        }
    </style>
</head>

<body>

    <!-- Background elements -->
    <div class="planet"></div>
    <div class="glow"></div>

    <!-- Main content -->
    <div class="main">

        <!-- ================= TODO APP ================= -->

        <div class="todo-card">

            <h2>To-Do App</h2>

            <!-- Progress -->
            <div class="progress-box">

                <div class="progress-info">

                    <p>Keep it Up!</p>

                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>

                </div>

                <div class="counter" id="counter">
                    0 / 0
                </div>

            </div>

            <!-- Add task -->
            <div class="input-area">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="Add a new task..."
                >

                <button
                    class="add-btn"
                    onclick="addTask()"
                >
                    +
                </button>

            </div>

            <!-- Tasks -->
            <ul id="taskList"></ul>

        </div>


        <!-- ================= HERO CONTENT ================= -->

        <div class="hero">

            <div class="subtitle">
                JavaScript Project
            </div>

            <h1>
                To-Do List
            </h1>

            <div class="technologies">

                <div class="tech">

                    <h3>HTML</h3>

                    <div class="badge html-badge">
                        5
                    </div>

                </div>


                <div class="tech">

                    <h3>CSS</h3>

                    <div class="badge css-badge">
                        3
                    </div>

                </div>


                <div class="tech">

                    <h3>JS</h3>

                    <div class="badge js-badge">
                        JS
                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- Mountains -->
    <div class="mountains"></div>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        const taskInput = document.getElementById("taskInput");
        const taskList = document.getElementById("taskList");
        const progressFill = document.getElementById("progressFill");
        const counter = document.getElementById("counter");


        // Load saved tasks
        let tasks = JSON.parse(localStorage.getItem("todoTasks")) || [];


        // Display tasks
        function displayTasks() {

            taskList.innerHTML = "";

            tasks.forEach(function(task) {

                const li = document.createElement("li");

                li.className = "task";

                if (task.completed) {
                    li.classList.add("completed");
                }


                // Check button
                const checkButton = document.createElement("button");

                checkButton.className = "check";

                checkButton.innerHTML =
                    task.completed ? "✓" : "";

                checkButton.onclick = function() {
                    toggleTask(task.id);
                };


                // Task name
                const span = document.createElement("span");

                span.className = "task-name";

                span.textContent = task.text;


                // Edit button
                const editButton = document.createElement("button");

                editButton.className = "task-btn edit";

                editButton.innerHTML = "✎";

                editButton.onclick = function() {
                    editTask(task.id);
                };


                // Delete button
                const deleteButton = document.createElement("button");

                deleteButton.className = "task-btn delete";

                deleteButton.innerHTML = "▮";

                deleteButton.onclick = function() {
                    deleteTask(task.id);
                };


                li.appendChild(checkButton);

                li.appendChild(span);

                li.appendChild(editButton);

                li.appendChild(deleteButton);

                taskList.appendChild(li);

            });


            updateProgress();

        }


        // Add task
        function addTask() {

            const text = taskInput.value.trim();

            if (text === "") {

                alert("Please enter a task!");

                return;
            }


            const newTask = {

                id: Date.now(),

                text: text,

                completed: false

            };


            tasks.push(newTask);


            saveTasks();


            taskInput.value = "";


            displayTasks();

        }


        // Enter key
        taskInput.addEventListener("keydown", function(event) {

            if (event.key === "Enter") {

                addTask();

            }

        });


        // Complete task
        function toggleTask(id) {

            tasks = tasks.map(function(task) {

                if (task.id === id) {

                    task.completed = !task.completed;

                }

                return task;

            });


            saveTasks();

            displayTasks();

        }


        // Edit task
        function editTask(id) {

            const task = tasks.find(function(task) {

                return task.id === id;

            });


            const newText = prompt(
                "Edit your task:",
                task.text
            );


            if (
                newText !== null &&
                newText.trim() !== ""
            ) {

                task.text = newText.trim();

                saveTasks();

                displayTasks();

            }

        }


        // Delete task
        function deleteTask(id) {

            tasks = tasks.filter(function(task) {

                return task.id !== id;

            });


            saveTasks();

            displayTasks();

        }


        // Update progress
        function updateProgress() {

            const total = tasks.length;

            const completed = tasks.filter(
                function(task) {
                    return task.completed;
                }
            ).length;


            counter.textContent =
                completed + " / " + total;


            let percentage = 0;


            if (total > 0) {

                percentage =
                    (completed / total) * 100;

            }


            progressFill.style.width =
                percentage + "%";

        }


        // Save to local storage
        function saveTasks() {

            localStorage.setItem(
                "todoTasks",
                JSON.stringify(tasks)
            );

        }


        // Initial display
        displayTasks();

    </script>

</body>
</html>
